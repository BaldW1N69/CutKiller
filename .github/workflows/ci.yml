name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6
      - name: Python workers
        working-directory: workers
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Lint
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: JSON Schemas à jour
        run: pnpm schema && git diff --exit-code schema

      - name: Tests (unitaires + intégration FFmpeg + bout en bout)
        run: pnpm test

      - name: Démo bout en bout + quality-check
        run: |
          pnpm fixtures
          pnpm cutkiller auto .cache/fixtures/cam-9x16.mp4 .cache/fixtures/phone-vfr.mp4 \
            .cache/fixtures/still.png .cache/fixtures/music-120bpm.wav \
            -p short -o out/demo --draft --min-score 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: |
            out/demo/quality.md
            out/demo/quality.json
            out/demo/edit.edl.json
            out/demo/final.mp4
          if-no-files-found: ignore
