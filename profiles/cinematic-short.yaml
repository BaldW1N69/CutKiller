# Profil « cinematic-short » : Reels / Shorts / TikTok (9:16) au rendu cinéma.
# Même étude que « cinematic » (docs/research/cinematic.md), adaptée au vertical :
# accroche gardée (plans ≤ 6 s), 2 à 4 mots par écran, pas de letterbox (le
# format vertical n'a pas de place à perdre), grain et vignette plus légers.
id: cinematic-short
version: 1.0.0
description: Vertical 9:16 au rendu cinéma pour Reels, Shorts et TikTok.
format: { kind: short, width: 1080, height: 1920, fps: 30 }
export:
  codec: h264
  minBitrateMbps: { "30": 16, "60": 24 }
  targetBitrateFactor: 1.5
  # Netteté : pas d'agrandissement au-delà de ×2 (un 1080p recadré en 9:16 : ×1,78).
  maxUpscale: 2
texture: { grain: 0.06, vignette: 0.3, halation: 0.3 }
color:
  look: film-print@1
  # Look par scène : une scène plate reçoit plus de courbe, une scène contrastée moins.
  sceneContrast: { enabled: true, targetRange: 0.72, strength: 0.5, max: 0.12 }
# B-roll : plans de coupe de 2–4 s sur les jump cuts puis les longues tirades (la voix
# continue dessous), calés sur les beats ; sans parole, montage d'un plan par mesure.
broll:
  enabled: true
  shotS: [1.5, 3]
  minSpacingS: 4
  headS: 2
  tailS: 2
  maxShare: 0.4
  beatsPerShot: 4
montage:
  maxSilenceMs: 400
  wordMarginMs: [90, 140]
  jlCutFrames: [4, 12]
  beatToleranceFrames: 1
  maxStaticShotS: 6
  minShotS: 1.5
  punchInScale: [1.04, 1.12]
  zoomCutLevels: [1.06, 1.1, 1.05, 1.08]
motion:
  microDurationMs: [150, 300]
  transitionDurationMs: [200, 500]
  # Fondus : le temps de lire un changement de lieu ou de chapitre (1 s, dip 1,2 s).
  dissolveDurationMs: [400, 1500]
  motionBlurThresholdPxPerFrame: 12
  overshoot: [0.03, 0.08]
  punchPreset: push-in@1
  punchLevels: [1.04, 1.07, 1.05]
  emphasisMinScore: 1.6
  punchMinSpacingS: 6
  transitions:
    sameSource: [dip-to-black@1]
    crossSource: [cross-dissolve@1]
    minSpacingS: 10
    minRemovedS: 1.5
captions:
  style: cinema-caption@1
  wordsPerScreen: [2, 4]
  maxLines: 2
  maxCharsPerLine: 18
  pauseBreakMs: 300
  maxDurationS: 2
  holdMs: 300
  minDurationMs: 500
  placement: { anchor: center, y: 0.72 }
  safeZones:
    tiktok: { top: 0.07, bottom: 0.25, left: 0.056, right: 0.13 }
    reels: { top: 0.14, bottom: 0.21, left: 0.056, right: 0.12 }
    shorts: { top: 0.125, bottom: 0.198, left: 0.056, right: 0.186 }
  maxSyncErrorFrames: { p95: 1, max: 3 }
  minContrast: 4.5
audio:
  integratedLufs: -14
  lufsTolerance: 1
  truePeakDbtp: -1
  duckingDb: [-18, -12]
  cutFadeMs: [5, 10]
  sfxToleranceFrames: 1
  renderTruePeakDbtp: -1.5
  musicBedLu: -5
  duck: { depthDb: -14, attackMs: 200, releaseMs: 500, mergeGapMs: 900, holdMs: 200 }
  sfx:
    transitions: {}
    gainDb: -14
