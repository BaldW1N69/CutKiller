# Profil « cinematic » : talking head ou vlog horizontal (16:9) au rendu cinéma.
# Issu de l'étude de 27 tutoriels et analyses (docs/research/cinematic.md) : plans
# plus longs, moins de punch-ins (poussées lentes à la place), fondus au lieu de
# whip-pans, look « tirage film », grain, vignette, letterbox 2,39:1, sous-titres sobres.
# Mêmes 25 règles QA, mesurées de la même façon ; seuls les seuils changent ici.
id: cinematic
version: 1.0.0
description: Horizontal 16:9 au rendu cinéma, rythme posé, texture film.
# Cadence des rushes quand elle est autorisée (24p reste en 24p : pas de saccade de pulldown).
format: { kind: long, width: 1920, height: 1080, fps: 30, matchSourceFps: true }
export:
  codec: h264
  # Le grain coûte du débit : cible plus haute que le profil long.
  minBitrateMbps: { "30": 16, "60": 24 }
  allowedFps: [24, 25, 30, 60]
  targetBitrateFactor: 1.5
  # Netteté : pas d'agrandissement au-delà de ×2 (un 1080p recadré en 9:16 : ×1,78).
  maxUpscale: 2
texture: { grain: 0.07, vignette: 0.35, halation: 0.35, letterbox: 2.39 }
color:
  look: film-print@1
  # Look par scène : une scène plate reçoit plus de courbe, une scène contrastée moins.
  sceneContrast: { enabled: true, targetRange: 0.72, strength: 0.5, max: 0.12 }
# B-roll : plans de coupe de 2–4 s sur les jump cuts puis les longues tirades (la voix
# continue dessous), calés sur les beats ; sans parole, montage d'un plan par mesure.
broll:
  enabled: true
  shotS: [2, 4]
  minSpacingS: 6
  headS: 3
  tailS: 2
  maxShare: 0.4
  beatsPerShot: 4
montage:
  # On laisse respirer : pauses jusqu'à 0,5 s, marges de mots plus larges.
  maxSilenceMs: 500
  hookMaxS: 5
  wordMarginMs: [100, 160]
  jlCutFrames: [4, 12]
  beatToleranceFrames: 1
  # Durée moyenne de plan d'un film : 4–6 s ; un plan fixe tient jusqu'à 10 s.
  maxStaticShotS: 10
  minShotS: 2
  punchInScale: [1.04, 1.12]
  zoomCutLevels: [1.06, 1.1, 1.05, 1.08]
motion:
  microDurationMs: [150, 300]
  transitionDurationMs: [200, 500]
  # Fondus : le temps de lire un changement de lieu ou de chapitre (1 s, dip 1,2 s).
  dissolveDurationMs: [400, 1500]
  motionBlurThresholdPxPerFrame: 12
  overshoot: [0.03, 0.08]
  # Poussée lente (900 ms, sans rebond) sur les seules phrases fortes, espacées.
  punchPreset: push-in@1
  punchLevels: [1.04, 1.07, 1.05]
  emphasisMinScore: 1.8
  punchMinSpacingS: 10
  transitions:
    sameSource: [dip-to-black@1]
    crossSource: [cross-dissolve@1]
    minSpacingS: 20
    minRemovedS: 2.5
captions:
  style: cinema-subtitle@1
  maxLines: 2
  maxCharsPerLine: 38
  pauseBreakMs: 500
  maxDurationS: 6
  holdMs: 400
  minDurationMs: 1000
  placement: { anchor: bottom, y: 0.9 }
  safeZones:
    title-safe: { top: 0.05, bottom: 0.05, left: 0.05, right: 0.05 }
  maxSyncErrorFrames: { p95: 1, max: 3 }
  minContrast: 4.5
audio:
  integratedLufs: -14
  lufsTolerance: 1
  maxLoudnessRangeLu: 15
  truePeakDbtp: -1
  duckingDb: [-18, -12]
  cutFadeMs: [5, 10]
  sfxToleranceFrames: 1
  renderTruePeakDbtp: -1.5
  # Musique plus présente, mouvements de ducking plus lents (pas de pompage).
  musicBedLu: -6
  duck: { depthDb: -14, attackMs: 250, releaseMs: 600, mergeGapMs: 1200, holdMs: 250 }
  # Fondus silencieux : pas de whoosh sans mouvement à l'image.
  sfx:
    transitions: {}
    gainDb: -14
