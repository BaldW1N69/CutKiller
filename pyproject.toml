[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutkiller"
version = "0.2.0"
description = "Montage vidéo piloté par l'écoute : coupe des silences, détection de beats, transcription, SFX et musiques libres de droits."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
gl = ["moderngl>=5.8"]
mcp = ["mcp>=1.2"]
all = ["faster-whisper>=1.0", "moderngl>=5.8", "mcp>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
cutkiller = "cutkiller.cli:main"
cutkiller-mcp = "cutkiller.mcp_server:main"

[tool.setuptools.packages.find]
include = ["cutkiller*"]

[tool.setuptools.package-data]
cutkiller = ["transitions/gl_transitions.json", "transitions/GL_TRANSITIONS_LICENSE"]

[tool.pytest.ini_options]
markers = ["network: tests qui appellent de vraies API (désactivés par défaut, lancer avec -m network)"]
addopts = "-m 'not network'"
